# Cấu hình giao diện web (đọc khi chạy `streamlit run` từ thư mục gốc dự án)
[client]
toolbarMode = "minimal"   # ẩn nút Deploy và các mục dành cho nhà phát triển ở góc trên

[theme]
# giao diện tối, bảng màu gần với các trang phim như Letterboxd
base = "dark"
primaryColor = "#ff8000"
backgroundColor = "#14181c"
secondaryBackgroundColor = "#2c3440"
textColor = "#d8e0e8"
borderColor = "#2c3440"
